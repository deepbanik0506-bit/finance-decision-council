# Render Blueprint for the Finance Decision Council API.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: finance-decision-council-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "5"
      - key: MAX_CONCURRENT_ANALYSES
        value: "2"
      - key: ENABLE_DOCS
        value: "true"
